<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="Wikivents website is gestopt">
  <title>Wikivents website is gestopt</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102a43;
      --muted: #526579;
      --paper: #f7f8f4;
      --white: #fff;
      --green: #b7e4c7;
      --green-dark: #246b50;
      --orange: #ffb86b;
      --line: #e4e9e3;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; }
    .wrap { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
    .topbar { padding: 24px 0; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 1.15rem; font-weight: 800; text-decoration: none; letter-spacing: -.03em; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px; background: var(--green); color: var(--green-dark); font-size: 1.25rem; }
    .hero { display: grid; grid-template-columns: 1.15fr .85fr; align-items: center; gap: 60px; padding: 82px 0 96px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 20px; color: var(--green-dark); font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .eyebrow::before { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); content: ""; }
    h1 { max-width: 700px; margin: 0; font-size: clamp(3rem, 7vw, 5.6rem); line-height: .99; letter-spacing: -.065em; }
    h1 span { color: var(--green-dark); }
    .intro { max-width: 570px; margin: 25px 0 30px; color: var(--muted); font-size: 1.15rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 9px; padding: 0 19px; border: 1px solid var(--ink); border-radius: 9px; background: var(--ink); color: var(--white); font-weight: 700; text-decoration: none; transition: transform .18s ease, box-shadow .18s ease; }
    .button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px #102a4324; }
    .button.secondary { background: transparent; color: var(--ink); }
    .illustration { position: relative; min-height: 360px; display: grid; place-items: center; }
    .sun { position: absolute; top: 24px; right: 24px; width: 92px; height: 92px; border-radius: 50%; background: var(--orange); }
    .orbit { position: relative; display: grid; width: min(330px, 85vw); aspect-ratio: 1; place-items: center; border: 1px solid #d6dfd5; border-radius: 50%; background: #edf3eb; }
    .orbit::before, .orbit::after { position: absolute; border: 1px solid #d6dfd5; border-radius: 50%; content: ""; }
    .orbit::before { inset: 30px; }
    .orbit::after { inset: 61px; }
    .center-card { z-index: 1; width: 190px; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--white); box-shadow: 0 18px 50px #102a4314; transform: rotate(-4deg); }
    .card-label { color: var(--green-dark); font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .center-card strong { display: block; margin: 7px 0 12px; font-size: 1.35rem; line-height: 1.2; }
    .avatars { display: flex; padding-left: 3px; }
    .avatar { display: grid; width: 30px; height: 30px; margin-left: -4px; place-items: center; border: 2px solid white; border-radius: 50%; background: var(--green); font-size: .8rem; }
    .avatar:nth-child(2) { background: #ffd7ad; }
    .avatar:nth-child(3) { background: #d7d2fa; }
    .avatar:nth-child(4) { background: #cce5f6; }
    .float { position: absolute; z-index: 2; padding: 11px 15px; border: 1px solid var(--line); border-radius: 12px; background: white; box-shadow: 0 10px 24px #102a4310; font-size: .85rem; font-weight: 700; }
    .float.one { top: 43px; left: 5px; transform: rotate(-5deg); }
    .float.two { right: 0; bottom: 55px; transform: rotate(4deg); }
    .section { padding: 76px 0; border-top: 1px solid var(--line); }
    .section-heading { max-width: 640px; margin-bottom: 34px; }
    .section h2 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 3rem); line-height: 1.1; letter-spacing: -.045em; }
    .section-heading p, .feature p { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .feature { min-height: 210px; padding: 25px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); }
    .icon { display: grid; width: 42px; height: 42px; margin-bottom: 20px; place-items: center; border-radius: 12px; background: #e7f2e8; font-size: 1.2rem; }
    .feature h3 { margin: 0 0 8px; font-size: 1.15rem; }
    .feature p { margin: 0; }
    .ideas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .idea { padding: 9px 14px; border: 1px solid var(--line); border-radius: 99px; background: white; color: var(--muted); font-size: .9rem; }
    .cta { display: flex; align-items: center; justify-content: space-between; gap: 28px; padding: 34px; border-radius: 18px; background: var(--ink); color: white; }
    .cta h2 { max-width: 520px; margin: 0; font-size: clamp(1.7rem, 4vw, 2.5rem); letter-spacing: -.04em; }
    .cta .button { flex-shrink: 0; border-color: var(--green); background: var(--green); color: var(--ink); }
    footer { display: flex; justify-content: space-between; gap: 20px; padding: 28px 0 36px; color: var(--muted); font-size: .9rem; }
    footer a { text-decoration-color: #aab8ad; text-underline-offset: 3px; }
    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; gap: 15px; padding: 55px 0 65px; }
      .illustration { min-height: 330px; }
      .grid { grid-template-columns: 1fr; }
      .feature { min-height: auto; }
      .cta { align-items: flex-start; flex-direction: column; }
      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <h1>Wikivents website is gestopt</h1>
</body>
</html>
